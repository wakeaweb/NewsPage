<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Günlük Gündem</title><style>body{font-family:Arial,sans-serif;background:#f4f5f7;color:#171717;margin:0}main{max-width:1100px;margin:40px auto;padding:0 20px}.mast{background:#111;color:#fff;padding:35px;border-radius:18px}.mast h1{font-family:Georgia,serif;font-size:48px;margin:0 0 8px}.muted{color:#aeb3ba}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:22px}.card{background:#fff;border-radius:16px;padding:24px;box-shadow:0 5px 20px #0000000d}.card h2{font-family:Georgia,serif;font-size:26px;margin-top:0}.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#666}.empty{padding:50px 0;color:#666}@media(max-width:700px){.grid{grid-template-columns:1fr}.mast h1{font-size:36px}}</style></head><body><main><section class="mast"><div class="tag">Günlük Haber Bülteni</div><h1>Dünün Gündemi</h1><div class="muted">Otomatik olarak güncellenecek.</div></section><div class="empty">İlk günlük içerik hazırlanıyor.</div></main></body></html>
